name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m unittest discover -s tests
          python tools/check_skill.py
      - name: Build skill zip
        run: zip -r horological.zip horological -x "*/__pycache__/*"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" horological.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" horological.zip --title "Horological $GITHUB_REF_NAME" --generate-notes
          fi
